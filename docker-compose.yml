version: '3.8'

services:
  app:
    build: .
    container_name: top11_app
    ports:
      - "8000:80"
    # volumes:
    #   - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: top11_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: top11
      MYSQL_USER: top11
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: top11_pma
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root

volumes:
  db_data: